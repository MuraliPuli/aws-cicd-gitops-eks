
apiVersion: apps/v1
kind: Deployment

metadata:
  name: aws-cicd-demo
  labels:
    app: aws-cicd-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: aws-cicd-demo

  template:
    metadata:
      labels:
        app: aws-cicd-demo

    spec:
      containers:
        - name: aws-cicd-demo
          image: YOUR_ECR_IMAGE_URI
          ports:
            - containerPort: 8080
